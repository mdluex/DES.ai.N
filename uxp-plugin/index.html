<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>DES.ai.N Bridge</title>
  <style>
    :root {
      --bg: #1c1e24;
      --fg: #e8eaed;
      --muted: #9aa0a6;
      --accent: #31a8ff;
      --ok: #34a853;
      --bad: #ea4335;
    }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--fg);
      padding: 12px;
    }
    h1 {
      font-size: 14px;
      margin: 0 0 8px;
      letter-spacing: 0.02em;
    }
    .row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
    label { font-size: 11px; color: var(--muted); min-width: 42px; }
    input {
      flex: 1;
      background: #101217;
      border: 1px solid #30343c;
      color: var(--fg);
      border-radius: 4px;
      padding: 6px 8px;
      font-size: 12px;
    }
    button {
      background: var(--accent);
      color: #041018;
      border: 0;
      border-radius: 4px;
      padding: 7px 12px;
      font-weight: 600;
      cursor: pointer;
    }
    button.secondary { background: #30343c; color: var(--fg); }
    #status {
      margin-top: 10px;
      font-size: 12px;
      padding: 8px;
      border-radius: 4px;
      background: #101217;
      border-left: 3px solid var(--muted);
      white-space: pre-wrap;
    }
    #status.ok { border-left-color: var(--ok); }
    #status.bad { border-left-color: var(--bad); }
    .hint { font-size: 11px; color: var(--muted); margin-top: 8px; line-height: 1.4; }
  </style>
</head>
<body>
  <h1>DES.ai.N Photoshop Bridge</h1>
  <div class="row">
    <label for="url">WS</label>
    <input id="url" value="ws://127.0.0.1:8765" />
  </div>
  <div class="row">
    <button id="connectBtn">Connect</button>
    <button id="disconnectBtn" class="secondary">Disconnect</button>
  </div>
  <div id="status">Disconnected</div>
  <p class="hint">
    Start the DES.ai.N MCP server first, then connect this panel.
    The plugin reconnects automatically with exponential backoff.
  </p>
  <script src="js/main.js"></script>
</body>
</html>
